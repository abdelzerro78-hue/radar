<title>Radar · Ctrl+Alt</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root { --g:#7dff9a; --g2:#3dff6a; --bg:rgba(8,22,14,.82); }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:#1b1d1f; overflow:hidden;
  font-family:'Courier New', monospace; color:var(--g); }

/* ---------- Carte plein écran ---------- */
#radar { position:absolute; inset:0; }
#map { position:absolute; inset:0; background:#2a3a40; }
.leaflet-tile-pane { filter:grayscale(.4) sepia(.15) hue-rotate(170deg) saturate(1.2) brightness(.85) contrast(1.15); }
/* Réglage des couleurs de la carte : grayscale (0 = très coloré, 1 = noir et blanc) et saturate (1 = normal, 1.5 = vif) */
.leaflet-control-attribution { font-size:9px; opacity:.6; }
.leaflet-top.leaflet-right { top:175px; }
.leaflet-bar a { background:var(--bg); color:var(--g); border-color:#6dff8d; }
.leaflet-bar { border:2px solid #6dff8d; box-shadow:0 0 10px rgba(61,255,106,.4); }

/* Faisceau : du centre jusqu'au cercle SWEEP_NM (taille recalculée à chaque image) */
/* ★ LUMIÈRE DU FAISCEAU RADAR : opacity:.5 = moitié de lumière. Mettez .3 pour moins, .8 pour plus */
#sweep { opacity:.5; position:absolute; border-radius:50%; pointer-events:none; z-index:500;
  background:conic-gradient(from 0deg, rgba(0,255,90,0) 0deg, rgba(0,255,90,0) 270deg,
    rgba(0,255,90,.28) 315deg, rgba(0,255,90,.7) 350deg, rgba(150,255,180,.95) 359deg, #eafff0 360deg);
  filter:drop-shadow(0 0 10px rgba(0,255,90,.9)); mix-blend-mode:screen; will-change:transform; }

#rings { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:450; }
.ring { stroke:#3dff6a; stroke-width:3; fill:none; filter:drop-shadow(0 0 4px #3dff6a) drop-shadow(0 0 10px rgba(61,255,106,.8)); }
.rl { fill:#7dff9a; font:bold 14px 'Courier New',monospace; paint-order:stroke; stroke:#06140b; stroke-width:4px; stroke-linejoin:round; }
.ring-label { background:rgba(8,22,14,.82); color:#7dff9a; font:bold 14px 'Courier New',monospace;
  text-align:center; line-height:20px; border-radius:2px; border:1px solid #3dff6a; text-shadow:0 0 6px #3dff6a; }
#diag { font-size:10px; font-weight:normal; line-height:1.3; opacity:.9; margin-top:4px; }
.centre { width:10px; height:10px; border-radius:50%; background:#ff3b3b; box-shadow:0 0 8px #f33; }

/* ---------- Avions ---------- */
/* ★ TAILLE DES AVIONS : 52px ici (largeur et hauteur). Si vous la changez, changez aussi iconSize et iconAnchor dans le code (cherchez iconSize:[52,52]) */
.pl { will-change:transform; position:relative; width:52px; height:52px; transition:opacity .2s; cursor:pointer; }
.pl img { width:52px; height:52px; display:block; image-rendering:auto; filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.75)); }
.pl.veh { display:flex; align-items:center; justify-content:center; }
.pl.veh svg { width:40px; height:40px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.pl.veh.tw svg { width:26px; height:46px; }
.pl.veh span { display:block; font-size:26px; line-height:52px; text-align:center; filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.8)); }
.pl.sel::after { content:''; position:absolute; inset:-5px; border:2px solid #fff; border-radius:50%; box-shadow:0 0 12px #3dff6a, inset 0 0 8px #3dff6a; pointer-events:none; }
.leaflet-marker-icon.plane { background:none; border:0; }

/* ---------- Panneaux ---------- */
.panel { position:absolute; z-index:1100; background:var(--bg); border:2px solid #6dff8d; border-radius:10px;
  padding:10px 14px; font-weight:bold; box-shadow:0 0 14px rgba(61,255,106,.35); }
#clock { left:16px; top:16px; } #clock .t { font-size:28px; letter-spacing:1px; } #clock .d { font-size:13px; margin-top:2px; }
#compass { right:16px; top:16px; padding:6px; }
#wx { left:16px; bottom:16px; font-size:14px; line-height:1.6; }
#target { right:16px; bottom:28px; font-size:14px; line-height:1.6; min-width:210px; }
#target b { display:block; margin-bottom:2px; }
#count { left:50%; bottom:6px; transform:translateX(-50%); padding:3px 12px; font-size:13px; }
#recenter, #place, #gpsbtn { right:16px; width:34px; height:34px; padding:0; font-size:18px; line-height:30px;
  text-align:center; cursor:pointer; color:var(--g); }
#recenter { top:255px; } #place { top:297px; } #gpsbtn { top:339px; }
#place.on { background:#3dff6a; color:#04140a; }
#gnd, #veh, #sty, #sat, #air { right:16px; top:423px; width:34px; height:34px; padding:0; font-size:16px; line-height:30px; text-align:center; cursor:pointer; }
#sty { right:58px; top:255px; } #sat { right:58px; top:297px; } #air { right:58px; top:339px; }
#airMenu { display:none; right:104px; top:255px; padding:5px 0; font-size:13px; z-index:1200; }
#airMenu div { padding:6px 16px; white-space:nowrap; cursor:pointer; }
#airMenu div:hover { background:rgba(61,255,106,.25); }
.apt-wrap { overflow:visible; background:none; border:0; }
.apt { position:absolute; transform:translate(-50%,-135%); background:rgba(8,22,14,.82); color:#7dff9a; border:1px solid #3dff6a;
  border-radius:3px; font:bold 11px 'Courier New',monospace; padding:1px 5px; white-space:nowrap; pointer-events:none; }
#sat.on { background:#3dff6a; color:#04140a; }
#toast { left:50%; top:120px; transform:translateX(-50%); z-index:1200; opacity:0; transition:opacity .4s; pointer-events:none; font-size:14px; white-space:nowrap; }
#toast.on { opacity:1; }
#spd { right:16px; top:381px; width:34px; height:34px; padding:0; font-size:11px; line-height:30px; text-align:center; cursor:pointer; color:var(--g); }
#range { background:#0b1a11; color:var(--g); border:1px solid #6dff8d; border-radius:4px; font:inherit; padding:1px 4px; cursor:pointer; }
body { transform:scale(var(--s,1)); transform-origin:center; }
body.proj { transform:rotate(180deg) scale(var(--s,1)); }
html { background:#000; }   /* le bord noir n'émet aucune lumière au plafond */
#size { left:50%; top:46px; transform:translateX(-50%); padding:3px 8px; font-size:13px; display:flex; gap:10px; align-items:center; user-select:none; white-space:nowrap; }
#size span { cursor:pointer; padding:0 5px; }
#proj { left:50%; top:10px; transform:translateX(-50%); padding:6px 14px; cursor:pointer; font-size:13px; white-space:nowrap; user-select:none; }
#proj.on { background:#3dff6a; color:#04140a; }
#target { max-width:340px; }
#cnt { cursor:pointer; }
.tdetail { margin-top:5px; padding-top:5px; border-top:1px solid rgba(109,255,141,.35); }
#wsrc { font-size:10px; font-weight:normal; opacity:.85; margin-top:2px; }
#ver { font-size:10px; font-weight:normal; opacity:.85; margin-top:2px; }
#status { font-size:11px; opacity:.8; font-weight:normal; }
.off { color:#ff7a5c !important; }
#install { left:50%; top:86px; transform:translateX(-50%); padding:5px 14px; cursor:pointer; font-size:13px; display:none; white-space:nowrap; }
#tClose { display:none; position:absolute; right:10px; top:4px; font-size:16px; cursor:pointer; }
.sm { display:none; }
/* ---- Téléphone (portrait ou paysage) : affichage compact pour voir la carte et les avions ---- */
@media (max-width:820px), (max-height:520px) {
  .panel { padding:4px 8px; border-width:1.5px; border-radius:8px; font-size:11px; box-shadow:0 0 8px rgba(61,255,106,.3); }
  #clock { left:6px; top:6px; } #clock .t { font-size:15px; letter-spacing:0; } #clock .d { display:none; }
  #compass { display:none; } #size { display:none; }
  #proj { top:6px; padding:4px 9px; font-size:13px; } #projTxt { display:none; }
  #install { top:40px; font-size:11px; padding:4px 10px; }
  .leaflet-top.leaflet-right { top:6px; right:0; }
  .leaflet-bar a { width:30px; height:30px; line-height:30px; }
  #recenter, #place, #gpsbtn { right:10px; width:30px; height:30px; font-size:15px; line-height:26px; }
  #recenter { top:76px; } #place { top:114px; } #gpsbtn { top:152px; }
  #spd { right:10px; top:190px; width:30px; height:30px; font-size:10px; line-height:26px; }
  #gnd, #veh, #sty, #sat { right:10px; top:228px; width:30px; height:30px; font-size:14px; line-height:26px; }
  #sty { right:46px; top:76px; } #sat { right:46px; top:114px; } #air { right:46px; top:152px; }
  #airMenu { right:84px; top:76px; }
  #wx { left:6px; bottom:6px; font-size:11px; line-height:1.35; max-width:55vw; } .wdirline, #diag { display:none; }
  #status { font-size:9px; }
  .tdetail { display:none; }
  #target { left:6px; right:6px; bottom:62px; max-width:none; min-width:0; font-size:12px; line-height:1.4; }
  body.hasSel .tdetail { display:block; } #tClose { display:block; }
  .rl { font-size:12px; }
}
</style>

<script>window.L || document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>');</script>
<script>
/* =====================================================================================
   ★ GUIDE DES RÉGLAGES (pour modifier le radar sans rien casser) ★
   Dans le Bloc-notes : Ctrl + F puis cherchez le symbole ★ pour passer d'un réglage à l'autre.
   Après chaque modification : Ctrl + S pour enregistrer, puis Ctrl + F5 dans le navigateur.
   Ne changez que les chiffres ou les textes entre guillemets ; gardez les ; et les , à leur place.
   Principaux réglages (cherchez le mot dans le fichier) :
     TRAINEE_HALO, TRAINEE_COEUR, TRAINEE_LARGEUR, TRAINEE_INTENSITE ... couleur et épaisseur de la traînée
     TRAIL_SEC ..... longueur de la traînée          SWEEP_SEC ..... vitesse du faisceau qui tourne
     #sweep { opacity ... lumière du faisceau        RINGS_NM ...... distances des cercles
     REFRESH_MS .... fréquence de mise à jour        BASE_LEAD ..... compensation du retard des données
     FIX_K ......... lissage du mouvement            SPEED ......... vitesse de départ (1 = réelle)
     CYCLE_S ....... durée d'un cycle en accéléré    MAX_NM ........ portée de départ (en NM)
     STYLES ........ styles de carte (filtres)       .pl { ... 52px  taille des avions
     AEROPORTS ..... liste des aéroports du bouton 🛫 (ajoutez une ligne pour en ajouter un)
     COMPTEUR_CODE . compteur anonyme de visites et d'installations (vide = désactivé)
   ===================================================================================== */
/* ================= CONFIGURATION ================= */
let   CENTER      = [50.8466, 4.3528];  // position par défaut (Bruxelles) ; remplacée par votre GPS
const INITIAL_NM  = 55;                 // ★ zone visible au démarrage (demi-côté) : contient le cercle de 50 NM
const RINGS_NM    = [20, 30, 50];       // ★ distances des cercles verts (en milles nautiques)
const SWEEP_NM    = 50;                 // le faisceau va du centre jusqu'à ce cercle
const REFRESH_MS  = 3000;               // ★ mise à jour des avions (en millisecondes)
const SWEEP_SEC   = 5;                  // ★ durée d'un tour du faisceau en secondes (plus petit = plus rapide)
/* ★★★ COMPTEUR ANONYME DE VISITES ET D'INSTALLATIONS (facultatif) ★★★ */
const COMPTEUR_CODE = '';   // ★ Laissez VIDE = aucun compteur. Pour l'activer : mettez entre les guillemets le code de votre compte GRATUIT GoatCounter (ex. 'radar-17jq' si votre page de statistiques est radar-17jq.goatcounter.com)
/* ★★★ COULEUR ET ASPECT DE LA TRAÎNÉE DES AVIONS (la queue derrière chaque avion) — modifiez ici ★★★ */
const TRAINEE_HALO      = '200,225,255';   // ★ halo doux autour de la traînée : ROUGE,VERT,BLEU (chaque chiffre de 0 à 255). Ici : blanc glacé
const TRAINEE_COEUR     = '245,250,255';   // ★ cœur de la traînée (le centre, plus clair). Ici : blanc glacé
const TRAINEE_LARGEUR   = 9;               // ★ largeur du cœur près de l'avion, en pixels (le halo est 2,2 fois plus large). Essayez 6 (fin) ou 12 (épais)
const TRAINEE_INTENSITE = 0.8;             // ★ intensité du cœur : 0 = invisible, 1 = opaque. Essayez 0.6 (plus discret)
/* Autres couleurs prêtes à copier (HALO / CŒUR) : cyan '70,210,235' / '150,238,250' · ambre '255,165,60' / '255,215,140' · bleu ciel '110,185,255' / '185,225,255' · vert '90,255,140' / '140,255,175' */
const STALE_MS    = 40000;              // avion retiré s'il n'est plus reçu
const LOW_ZOOM    = 8;                  // en dessous : étiquettes masquées
const SOURCES = [   // (lat, lon, rayon NM) → URL
  (la, lo, r) => `https://api.adsb.lol/v2/point/${la}/${lo}/${r}`,
  (la, lo, r) => `https://api.airplanes.live/v2/point/${la}/${lo}/${r}`,
  (la, lo, r) => `https://opendata.adsb.fi/api/v2/lat/${la}/lon/${lo}/dist/${r}`,
  (la, lo, r) => {   // OpenSky : zone rectangulaire, convertie ensuite au même format
    const d = r / 60, e = d / Math.cos(la * Math.PI / 180);
    return `https://opensky-network.org/api/states/all?lamin=${la - d}&lamax=${+la + d}&lomin=${lo - e}&lomax=${+lo + e}`;
  }
];
const NAMES = ['adsb.lol', 'airplanes.live', 'adsb.fi', 'OpenSky'];
if (location.protocol.startsWith('http')) {   // page servie par server.js : on l'essaie en premier
  SOURCES.unshift((la, lo, r) => `/api/planes?lat=${la}&lon=${lo}&r=${r}`); NAMES.unshift('serveur local');
}
const NM = 1852, FT = 0.3048, RAD = Math.PI / 180;
let COS0 = Math.cos(CENTER[0] * RAD);

/* ================= CARTE ================= */
const map = L.map('map', { zoomControl:false, zoomSnap:0.25, zoomDelta:0.5, wheelPxPerZoomLevel:90,
  minZoom:6, maxZoom:21, zoomAnimation:false, markerZoomAnimation:false, attributionControl:true });
L.control.zoom({ position:'topright', zoomInTitle:'Zoom +', zoomOutTitle:'Zoom −' }).addTo(map);
const baseLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  { maxNativeZoom:19, maxZoom:21, zIndex:1, attribution:'Tiles © Esri — OpenStreetMap contributors' }).addTo(map);
const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxNativeZoom:18, maxZoom:21, zIndex:2, attribution:'Imagery © Esri, Maxar, Earthstar Geographics' });
const satOverlays = [   // routes puis noms de lieux, par-dessus l'image satellite
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom:18, maxZoom:21, zIndex:3 }),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom:18, maxZoom:21, zIndex:4 })
];

function fit() {
  map.invalidateSize(false);
  const dLat = INITIAL_NM * NM / 111320, dLon = dLat / COS0;
  map.fitBounds([[CENTER[0] - dLat, CENTER[1] - dLon], [CENTER[0] + dLat, CENTER[1] + dLon]], { animate:false, padding:[0,0] });
}
fit();
window.addEventListener('resize', () => map.invalidateSize(false));
document.getElementById('recenter').addEventListener('click', fit);

const centerLayer = L.layerGroup().addTo(map);
function drawCenter() {                           // cercles + point rouge, centrés sur CENTER
  centerLayer.clearLayers();
  L.marker(CENTER, { interactive:false, zIndexOffset:2000, icon:L.divIcon({ className:'', html:'<div class="centre"></div>', iconSize:[10,10], iconAnchor:[5,5] }) }).addTo(centerLayer);
}
drawCenter();

/* ---- Position GPS : le point rouge reste sur vous ---- */
let firstFix = true, manual = false, placing = false;
function setCenter(n, recenter) {
  CENTER = n; COS0 = Math.cos(n[0] * RAD); drawCenter();
  if (recenter) fit();
  if (typeof weather === 'function') weather();
  if (typeof refresh === 'function') refresh();
}
try { const s = JSON.parse(localStorage.getItem('radarPos') || 'null'); if (s) { manual = true; setCenter(s, true); } } catch (e) {}

if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(pos => {
    if (manual) return;                                     // la position placée à la main reste prioritaire
    const n = [pos.coords.latitude, pos.coords.longitude];
    if (!firstFix && map.distance(CENTER, n) < 30) return;  // ignore les micro-variations
    const f = firstFix; firstFix = false; setCenter(n, f);
  }, err => { console.warn('GPS indisponible', err); document.getElementById('status').textContent = 'GPS : ' + err.message; },
  { enableHighAccuracy:true, maximumAge:10000, timeout:20000 });
}

/* ---- Position manuelle : 📍 puis clic sur la carte (mémorisée) ; ◎ revient au GPS ---- */
const placeBtn = document.getElementById('place');
placeBtn.addEventListener('click', () => {
  placing = !placing; placeBtn.classList.toggle('on', placing);
  map.getContainer().style.cursor = placing ? 'crosshair' : '';
});
map.on('click', e => {
  if (!placing) return;
  placing = false; placeBtn.classList.remove('on'); map.getContainer().style.cursor = '';
  manual = true;
  const n = [e.latlng.lat, e.latlng.lng];
  try { localStorage.setItem('radarPos', JSON.stringify(n)); } catch (x) {}
  setCenter(n, false);
});
document.getElementById('gpsbtn').addEventListener('click', () => {
  manual = false; firstFix = true;
  try { localStorage.removeItem('radarPos'); } catch (x) {}
  document.getElementById('status').textContent = 'recherche GPS…';
});

function lowZoom() { document.getElementById('radar').classList.toggle('low', map.getZoom() < LOW_ZOOM); }
map.on('zoomend', lowZoom); lowZoom();
</script>
<script>
if (!window.L) {
  document.getElementById('radar').insertAdjacentHTML('beforeend',
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20%;z-index:900;color:#ff7a5c">' +
    'Carte non chargée : Leaflet est bloqué.<br>Ouvrez radar.html directement dans votre navigateur.</div>');
}
/* ================= BOUSSOLE ================= */
(function () {
  let s = '<svg width="120" height="120" viewBox="-60 -60 120 120"><circle r="56" fill="none" stroke="#6dff8d" stroke-width="1.5"/>';
  for (let a = 0; a < 360; a += 10) {
    const big = a % 30 === 0, r1 = big ? 46 : 50;
    s += `<line x1="0" y1="${-r1}" x2="0" y2="-55" stroke="#7dff9a" stroke-width="1" transform="rotate(${a})"/>`;
    if (big && a) s += `<text x="0" y="-36" font-size="8" fill="#7dff9a" text-anchor="middle" transform="rotate(${a})">${a}</text>`;
  }
  s += '<path d="M0-34 L6 -18 L-6 -18Z" fill="#7dff9a"/><text y="-37" font-size="9" fill="#7dff9a" text-anchor="middle" font-weight="bold">N</text>' +
       '<text y="6" font-size="12" fill="#7dff9a" text-anchor="middle" font-weight="bold">NORD</text>' +
       '<text y="19" font-size="8" fill="#7dff9a" text-anchor="middle">(0°)</text></svg>';
  document.getElementById('compass').innerHTML = s;
})();

/* ================= HORLOGE ================= */
function tick() {
  const d = new Date();
  document.getElementById('time').textContent = d.toLocaleTimeString('fr-BE', { timeZone:'Europe/Brussels' });
  document.getElementById('date').textContent = d.toLocaleDateString('fr-BE',
    { timeZone:'Europe/Brussels', weekday:'short', day:'2-digit', month:'long', year:'numeric' }).toUpperCase();
}
tick(); setInterval(tick, 500);

/* ================= MÉTÉO (Open-Meteo, toutes les 10 min) ================= */
const CARD = ['N','NE','E','SE','S','SO','O','NO'];
async function weather() {
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  let w = null;
  if (location.protocol.startsWith('http')) {         // via le serveur : mesure réelle de la station la plus proche
    try { const j = await (await fetch(`/api/weather?lat=${CENTER[0].toFixed(4)}&lon=${CENTER[1].toFixed(4)}`)).json(); if (j && j.source) w = j; } catch (e) {}
  }
  if (!w) {                                           // secours : modèle de prévision (moins précis)
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CENTER[0]}&longitude=${CENTER[1]}` +
        '&current=temperature_2m,wind_speed_10m,wind_direction_10m&wind_speed_unit=kmh');
      const c = (await r.json()).current;
      w = { temp:c.temperature_2m, wind:c.wind_speed_10m, dir:c.wind_direction_10m, source:'modèle' };
    } catch (e) { console.warn('Météo indisponible', e); return; }
  }
  set('temp', Math.round(w.temp));
  set('wind', w.wind == null ? '--' : Math.round(w.wind));
  set('wdir', w.dir == null ? 'variable' : CARD[Math.round(w.dir / 45) % 8] + ' ' + Math.round(w.dir) + '°');
  set('wsrc', w.station ? 'mesuré : ' + w.station + ' · ' + w.distKm + ' km' : 'estimé (modèle)');
}
weather(); setInterval(weather, 600000);

      while (p.trail.length && t - p.trail[0].t > TRAIL_SEC * 1000 / Math.max(1, SPEED / 2)) p.trail.shift();
    }
    if (!p.el) p.el = p.marker.getElement();
    if (p.el) {
      const pl = p.pl || (p.pl = p.el.querySelector('.pl')), b = polar(p.lat, p.lon).b;
      const diff = (sweepAngle - b + 360) % 360;       // l'avion « s'allume » au passage du faisceau
      pl.style.opacity = ((0.88 + 0.12 * Math.max(0, 1 - diff / 220)) * p.fa).toFixed(2);
      p.ang = p.psi;                                                  // le nez pointe toujours dans le sens où l'avion avance
      const ex = map.latLngToLayerPoint([p.lat, p.lon]);              // Leaflet arrondit au pixel entier : on rend la partie décimale
      pl.style.transform = `translate3d(${(ex.x - Math.round(ex.x)).toFixed(2)}px,${(ex.y - Math.round(ex.y)).toFixed(2)}px,0)`;
      if (!p.veh || (p.veh === 'truck' && p.gs > 2)) pl.firstChild.style.transform = `rotate(${p.ang.toFixed(1)}deg)`;
      pl.classList.toggle('sel', p.id === selected);
    }
  }
  drawTrails();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= CIBLE ACTIVE (clic sur un avion) + COMPTEUR ================= */
const routes = new Map();
let shown = null;
const countryName = c => { try { return new Intl.DisplayNames(['fr'], { type:'region' }).of(c); } catch (e) { return c; } };
function fmtAp(a) {
  let place = a.city || a.name || a.icao || '?';
  place = place.replace(/\s*\([^)]*\)/g, '').replace(/\s+(International\s+)?Airport$/i, '').trim() || place;   // « Brussels Airport (Zaventem Airport) » -> « Brussels »
  const code = a.iata || a.icao || '';
  return place + (code ? ' (' + code + ')' : '') + (a.country ? ' · ' + countryName(a.country) : '');
}
async function showRoute(p) {                     // origine / destination (via server.js)
  const from = document.getElementById('tFrom'), to = document.getElementById('tTo');
  if (!location.protocol.startsWith('http')) { from.textContent = to.textContent = 'lancez server.js'; return; }
  let r = routes.get(p.call);
  if (!r) {
    from.textContent = to.textContent = '…';
    try { r = await (await fetch(`/api/route?callsign=${encodeURIComponent(p.call)}&lat=${p.lat}&lon=${p.lon}`)).json(); }
    catch (e) { r = { source:null }; }
    if (r.source) routes.set(p.call, r);
  }
  p.destAp = r.dest || null;                      // mémorisé pour l'heure d'arrivée
  if (selected !== p.id) return;                  // l'utilisateur a cliqué ailleurs entre-temps
  from.textContent = r.origin ? fmtAp(r.origin) : 'inconnue';
  to.textContent = r.dest ? fmtAp(r.dest) : 'inconnue';
}
function etaText(p) {                            // heure d'arrivée estimée : distance restante (ligne droite) / vitesse
  const d = p.destAp;
  if (!d) return '--';
  if (!Number.isFinite(d.lat) || !Number.isFinite(d.lon)) return 'inconnue';
  if (p.ground) return 'au sol';
  const P = predict(p, Date.now()), f1 = P[0] * RAD, f2 = d.lat * RAD, dl = (d.lon - P[1]) * RAD;
  const h = Math.sin((f2 - f1) / 2) ** 2 + Math.cos(f1) * Math.cos(f2) * Math.sin(dl / 2) ** 2;
  const dist = 2 * 3440.065 * Math.asin(Math.min(1, Math.sqrt(h)));        // milles nautiques
  if (dist < 2) return 'arrivée imminente';
  if (p.gs < 80) return '--';
  const min = dist / p.gs * 60, at = new Date(Date.now() + min * 60000);
  const hm = at.toLocaleTimeString('fr-BE', { hour:'2-digit', minute:'2-digit', timeZone:'Europe/Brussels' });
  return '≈ ' + hm + ' (' + (min >= 90 ? Math.floor(min / 60) + ' h ' + String(Math.round(min % 60)).padStart(2, '0') : Math.round(min) + ' min') + ')';
}
setInterval(() => {
  document.getElementById('n').textContent = planes.size;
  const p = planes.get(selected); if (!p) return;
  if (shown !== selected) { shown = selected; showRoute(p); }
  document.getElementById('tCall').textContent = p.call;
  document.getElementById('tType').textContent = [p.type, p.reg].filter(Boolean).join(' · ');
  document.getElementById('tAlt').textContent = Math.round(p.alt * FT) + 'm';
  document.getElementById('tSpd').textContent = Math.round(p.gs) + 'kts';
  document.getElementById('tEta').textContent = etaText(p);
}, 500);

/* ================= MODE PROJECTEUR PLAFOND (bouton ou Ctrl+Alt) ================= */
const projBtn = document.getElementById('proj'), projTxt = document.getElementById('projTxt');
function setProj(on, fullscreen = true) {
  document.body.classList.toggle('proj', on);
  projBtn.classList.toggle('on', on);
  projTxt.textContent = on ? ' PROJECTEUR : ON · Ctrl+Alt' : ' PROJECTEUR PLAFOND · Ctrl+Alt';
  try { localStorage.setItem('radarProj', on ? '1' : '0'); } catch (e) {}
  if (fullscreen) {
    try {
      if (on && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
    } catch (e) {}
  }
  setTimeout(() => map.invalidateSize(false), 150);
}
const toggleProj = () => setProj(!document.body.classList.contains('proj'));
projBtn.addEventListener('click', toggleProj);
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if ((e.key === 'Alt' && e.ctrlKey) || (e.key === 'Control' && e.altKey)) { e.preventDefault(); toggleProj(); }
});
try { if (localStorage.getItem('radarProj') === '1') setProj(true, false); } catch (e) {}
/* ================= ÉCRAN TOUJOURS ALLUMÉ (projection) ================= */
let wake = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
}
keepAwake(); document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

/* ================= TAILLE DE L'IMAGE (ajuster au plafond) ================= */
let UI_SCALE = 1;
try { const v = parseFloat(localStorage.getItem('radarScale')); if (v >= 0.5 && v <= 1.3) UI_SCALE = v; } catch (e) {}
function setScale(v) {
  UI_SCALE = Math.min(1.3, Math.max(0.5, Math.round(v * 20) / 20));
  document.documentElement.style.setProperty('--s', UI_SCALE);
  document.getElementById('szv').textContent = Math.round(UI_SCALE * 100) + '%';
  try { localStorage.setItem('radarScale', UI_SCALE); } catch (e) {}
}
document.getElementById('szm').addEventListener('click', () => setScale(UI_SCALE - 0.05));
document.getElementById('szp').addEventListener('click', () => setScale(UI_SCALE + 0.05));
document.getElementById('szv').addEventListener('click', () => setScale(1));
window.addEventListener('keydown', e => {
  if (e.key === 'PageUp') { e.preventDefault(); setScale(UI_SCALE + 0.05); }
  if (e.key === 'PageDown') { e.preventDefault(); setScale(UI_SCALE - 0.05); }
});
setScale(UI_SCALE);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ================= INSTALLATION COMME APPLICATION ================= */
document.getElementById('tClose').addEventListener('click', () => document.body.classList.remove('hasSel'));
const installBtn = document.getElementById('install');
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; installBtn.style.display = 'block'; });
installBtn.addEventListener('click', async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt(); await deferredInstall.userChoice;
  deferredInstall = null; installBtn.style.display = 'none';
});
window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });

/* ================= AÉROPORTS : raccourcis pour aller les voir (bouton 🛫) ================= */
/* ★ LISTE DES AÉROPORTS : [nom affiché, code, latitude, longitude]. Pour en ajouter un, copiez une ligne et changez les valeurs. */
const AEROPORTS = [
  ['Zaventem (Bruxelles)',      'BRU', 50.9014, 4.4844],
  ['Charleroi (Bruxelles-Sud)', 'CRL', 50.4592, 4.4538],
  ['Liège',                     'LGG', 50.6374, 5.4432],
  ['Anvers',                    'ANR', 51.1894, 4.4603],
  ['Ostende-Bruges',            'OST', 51.1989, 2.8622],
  ['Courtrai-Wevelgem',         'KJK', 50.8172, 3.2047]
];
const airBtn = document.getElementById('air'), airMenu = document.getElementById('airMenu');
function goAirport(nom, la, lo) {
  map.setView([la, lo], 13, { animate:false });
  const d = polar(la, lo).d;                                      // distance (NM) entre vous et l'aéroport
  let note = ' · à ' + Math.round(d) + ' NM de vous';
  if (d + 3 > MAX_NM) {                                           // plus loin que la portée : on l'agrandit pour charger les avions de l'aéroport
    const r = RANGES.find(x => x >= d + 3);
    if (r) { MAX_NM = r; try { localStorage.setItem('radarRange', MAX_NM); } catch (e) {} refresh(); note += ' · portée ' + r + ' NM'; }
    else note += ' · hors de portée (plus de ' + RANGES[RANGES.length - 1] + ' NM)';
  }
  toast.textContent = '🛫 ' + nom + note; toast.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('on'), 2600);
}
AEROPORTS.forEach(([nom, code, la, lo]) => {
  L.marker([la, lo], { interactive:false, keyboard:false, zIndexOffset:-500,
    icon:L.divIcon({ className:'apt-wrap', html:'<span class="apt">✈ ' + code + '</span>', iconSize:[0, 0] }) }).addTo(map);   // étiquette sur la carte
  const it = document.createElement('div'); it.textContent = '✈ ' + nom + ' (' + code + ')';
  it.addEventListener('click', () => { airMenu.style.display = 'none'; goAirport(nom, la, lo); });
  airMenu.appendChild(it);
});
const homeIt = document.createElement('div'); homeIt.textContent = '⌖ Ma position';
homeIt.addEventListener('click', () => { airMenu.style.display = 'none'; fit(); });
airMenu.appendChild(homeIt);
airBtn.addEventListener('click', e => { e.stopPropagation(); airMenu.style.display = airMenu.style.display === 'block' ? 'none' : 'block'; });
document.addEventListener('click', () => { airMenu.style.display = 'none'; });

/* ================= COMPTEUR ANONYME (facultatif, désactivé tant que COMPTEUR_CODE est vide) ================= */
(function () {
  if (!COMPTEUR_CODE) return;                                          // vide = aucun compteur, rien n'est envoyé nulle part
  if (navigator.doNotTrack === '1' || location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname)) return;   // respecte « Ne pas me suivre » ; ignore vos essais sur le PC
  const send = (path, title) => { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path, title, event:true }); } catch (e) {} };
  const sc = document.createElement('script');
  sc.async = true;
  sc.dataset.goatcounter = 'https://' + COMPTEUR_CODE + '.goatcounter.com/count';               // la visite elle-même est comptée automatiquement
  sc.src = 'https://gc.zgo.at/count.js';
  sc.onload = () => {
    const app = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
    if (app) send('ouverture-appli-installee', "Ouverture depuis l'application installée");        // ouverture depuis l'icône de l'écran d'accueil
  };
  document.head.appendChild(sc);
  window.addEventListener('appinstalled', () => send('installation', "Installation de l'application"));   // quelqu'un vient d'installer l'application
})();
</script>
